name: Build Python wheels
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build-wheels:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        WHEEL_TYPE:
          - i686
          - x86_64
          - x86_64_tensorflow
        include:
          - WHEEL_TYPE: i686
            DOCKER_IMAGE: mtgupf/essentia-builds:manylinux2014_i686
            PRE_CMD: linux32
          - WHEEL_TYPE: x86_64
            DOCKER_IMAGE: mtgupf/essentia-builds:manylinux2014_x86_64
          - WHEEL_TYPE: x86_64_tensorflow
            DOCKER_IMAGE: mtgupf/essentia-builds:manylinux2014_x86_64
            WITH_TENSORFLOW: 1

    env:
      DOCKER_IMAGE: ${{ matrix.DOCKER_IMAGE }} 
      WITH_TENSORFLOW: ${{ matrix.WITH_TENSORFLOW }}
      PRE_CMD: ${{ matrix.PRE_CMD }}
      # Store the sccache compilation cache in the GitHub Actions cache so the
      # C++ object files are shared across runs.
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch release tags from GitHub
        # Workaround for https://github.com/actions/checkout/issues/290
        run: git fetch --tags --force
      - name: Export the GitHub Actions cache credentials for sccache
        # sccache's GHA backend needs these two variables, which are not
        # exposed to workflow steps by default:
        # https://github.com/mozilla/sccache/blob/main/docs/GHA.md
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheels in a Docker image
        run: |
          docker pull $DOCKER_IMAGE > /dev/null
          docker run --rm -v `pwd`:/io --env WITH_TENSORFLOW=$WITH_TENSORFLOW --env SCCACHE_GHA_ENABLED --env ACTIONS_RESULTS_URL --env ACTIONS_RUNTIME_TOKEN $DOCKER_IMAGE $PRE_CMD /io/travis/build_wheels.sh
      - name: Build sdist
        run: | 
          ls wheelhouse/
          sudo python setup.py sdist
      - name: Upload wheels and sdist
        uses: actions/upload-artifact@v6
        with:
          name: essentia-python-wheels
          path: |
            wheelhouse/essentia*.whl
            wheelhouse/essentia*.tar.gz
          if-no-files-found: error
